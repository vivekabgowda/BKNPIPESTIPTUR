function onMatCat(){
  var cat = (document.getElementById('m-cat-h')||document.getElementById('m-cat')).value;
  var isWire = cat==='steel_wire';
  document.getElementById('m-wire').style.display = isWire?'':'none';
  document.getElementById('m-single').style.display = isWire?'none':'';
  if(!isWire){
    var r = MAT_SINGLE.find(function(x){return x.id===cat;});
    var unitEl = document.getElementById('m-unit');
    var rateEl = document.getElementById('m-rate-wrap');
    if(unitEl&&r) unitEl.textContent='('+r.unit+')';
    if(rateEl) rateEl.style.display = r&&r.rate?'':'none';
  }
  var sugg = getLastSupplier(cat);
  var supplierEl = document.getElementById('m-supplier');
  var hintEl = document.getElementById('m-sugg-hint');
  if(supplierEl&&sugg&&!supplierEl.value){supplierEl.value=sugg;if(hintEl)hintEl.textContent='';}
  else if(sugg&&supplierEl&&supplierEl.value!==sugg){if(hintEl)hintEl.textContent='↩ Use "'+sugg+'"';}
}

function applySupplierSugg(){
  var cat=(document.getElementById('m-cat-h')||document.getElementById('m-cat')).value;
  var sugg=getLastSupplier(cat);
  var el=document.getElementById('m-supplier');
  var hint=document.getElementById('m-sugg-hint');
  if(el&&sugg)el.value=sugg;
  if(hint)hint.textContent='';
}

function onWireCalc(){
  var tot=0;
  WIRE_SIZES.forEach(function(sz){tot+=parseFloat(document.getElementById('w-amt-'+sz.id).value||0);});
  var el=document.getElementById('wire-tot');
  if(el)el.textContent='₹'+Number(tot).toLocaleString('en-IN');
  var amtEl=document.getElementById('m-amt');
  if(amtEl&&tot>0)amtEl.value=tot;
}

function onMatRateCalc(){
  var cat=(document.getElementById('m-cat-h')||document.getElementById('m-cat')).value;
  var r=MAT_SINGLE.find(function(x){return x.id===cat;});
  if(!r||!r.rate)return;
  var qty=parseFloat(document.getElementById('m-qty').value||0);
  var rate=parseFloat(document.getElementById('m-rate').value||0);
  var amt=qty*rate;
  var amtEl=document.getElementById('m-amt');
  var autoEl=document.getElementById('m-amt-auto');
  if(amtEl&&amt>0)amtEl.value=amt;
  if(autoEl)autoEl.textContent=qty&&rate?'(auto: ₹'+Number(amt).toLocaleString('en-IN')+')':'';
}

async function saveMat(editId){
  var btn=document.querySelector('.modal-ft .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var cat=(document.getElementById('m-cat-h')||document.getElementById('m-cat')).value;
  var isWire=cat==='steel_wire';
  var data;
  if(isWire){
    var sizes={};var any=false;
    WIRE_SIZES.forEach(function(sz){
      var qty=parseFloat(document.getElementById('w-qty-'+sz.id).value||0);
      var amt=parseFloat(document.getElementById('w-amt-'+sz.id).value||0);
      sizes[sz.id]={qty:qty,amt:amt};
      if(qty>0)any=true;
    });
    if(!any){alert('Enter qty for at least one size');if(btn){btn.disabled=false;btn.textContent='Save delivery';}return;}
    data={date:document.getElementById('m-date').value,material:'steel_wire',sizes:sizes,totalAmt:parseFloat(document.getElementById('m-amt').value||0)||0,supplier:document.getElementById('m-supplier').value.trim(),note:document.getElementById('m-note').value.trim()};
  }else{
    var qty=parseFloat(document.getElementById('m-qty').value||0);
    if(!qty){alert('Enter a quantity');if(btn){btn.disabled=false;btn.textContent='Save delivery';}return;}
    data={date:document.getElementById('m-date').value,material:cat,qty:qty,rate:parseFloat(document.getElementById('m-rate').value||0)||0,totalAmt:parseFloat(document.getElementById('m-amt').value||0)||0,supplier:document.getElementById('m-supplier').value.trim(),note:document.getElementById('m-note').value.trim()};
  }
  try{
    if(editId){await col('materials').doc(editId).update(data);}
    else{data.payments=[];await col('materials').doc(uid()).set(data);}
    closeModal();
  }catch(e){alert('Save failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Save delivery';} }
}

function openPayModal(matId){
  var entry=cache.materials.find(function(m){return m.id===matId;});
  if(!entry)return;
  var isWire=entry.material==='steel_wire';
  var label=isWire?'Steel Wire':(MAT_SINGLE.find(function(r){return r.id===entry.material;})||{label:entry.material}).label;
  var paid=(entry.payments||[]).reduce(function(s,p){return s+(Number(p.amt||0));},0);
  var bal=(Number(entry.totalAmt||0))-paid;
  modal('<div class="modal">'+
    '<div class="modal-hd"><h3 style="font-size:15px;font-weight:700">Add payment — '+label+'</h3><button onclick="closeModal()" style="border:none;font-size:22px;background:none;cursor:pointer;color:#94a3b8">&times;</button></div>'+
    '<div class="modal-bd">'+
      (entry.totalAmt?'<div class="alert-info" style="margin-bottom:12px">Total: <strong>₹'+fmt(entry.totalAmt)+'</strong> · Paid: <strong>₹'+fmt(paid)+'</strong> · Balance: <strong style="color:'+(bal>0?'#991b1b':'#065f46')+'">₹'+fmt(bal)+'</strong></div>':'')+
      '<div class="fr c2">'+
        '<div class="fg"><label>Payment date</label><input type="date" id="pay-date" value="'+today()+'"></div>'+
        '<div class="fg"><label>Amount (₹)</label><input type="number" id="pay-amt" min="0" placeholder="0"'+(bal>0?' value="'+bal+'"':'')+'></div>'+
      '</div>'+
      '<div class="fg"><label>Note (optional)</label><input type="text" id="pay-note" placeholder="Cash, UPI, cheque…"></div>'+
    '</div>'+
    '<div class="modal-ft"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePayment(\''+matId+'\')">Save payment</button></div>'+
  '</div>');
}

async function savePayment(matId){
  var btn=document.querySelector('.modal-ft .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var amt=parseFloat(document.getElementById('pay-amt').value||0);
  if(!amt){alert('Enter an amount');if(btn){btn.disabled=false;btn.textContent='Save payment';}return;}
  var entry=cache.materials.find(function(m){return m.id===matId;});
  if(!entry)return;
  var payments=(entry.payments||[]).concat([{date:document.getElementById('pay-date').value,amt:amt,note:document.getElementById('pay-note').value.trim()}]);
  try{await col('materials').doc(matId).update({payments:payments});closeModal();}
  catch(e){alert('Save failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Save payment';} }
}

async function delPayment(matId,idx){
  if(!confirm('Remove this payment?'))return;
  var entry=cache.materials.find(function(m){return m.id===matId;});
  if(!entry)return;
  var payments=(entry.payments||[]).filter(function(_,i){return i!==idx;});
  await col('materials').doc(matId).update({payments:payments});
}

async function delMat(id){if(!confirm('Delete delivery and all payments?'))return;await col('materials').doc(id).delete();}


// ── STAFF ────────────────────────────────────────────────────────────────────
var MIGRATION_MAP = {'Driver 1':'Umesh','Driver 2':'Revanna','Helper':'Ramesh'};

function renderStaff(){
  document.getElementById('topbar-action').innerHTML =
    '<div style="display:flex;gap:8px">'+
      '<button class="btn" onclick="openEditStaffModal()"><i class="ti ti-users"></i> Edit names</button>'+
      '<button class="btn btn-primary" onclick="openAttModal()"><i class="ti ti-calendar"></i> Log attendance</button>'+
    '</div>';

  var att = cache.attendance;
  var advances = cache.advances.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  var oldNames = Object.keys(MIGRATION_MAP);
  var hasOld = att.some(function(a){return oldNames.indexOf(a.staff)>-1;})||advances.some(function(a){return oldNames.indexOf(a.staff)>-1;});

  var summary = STAFF.map(function(s){
    return {name:s,days:att.filter(function(a){return a.present&&a.staff===s;}).length,
      totalAdv:advances.filter(function(a){return a.staff===s;}).reduce(function(sum,a){return sum+(Number(a.amount||0));},0)};
  });

  document.getElementById('content').innerHTML =
    (hasOld?'<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><strong>⚠ Some records still use old names</strong> (Driver 1/2/Helper)</div><button id="mig-btn" class="btn" style="background:#78350f;color:#fff;border-color:#78350f" onclick="migrateStaffNames()">Fix old records</button></div>':'')+
    '<div class="grid-3">'+
      summary.map(function(s){
        return '<div class="card">'+
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'+
            '<div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1e40af,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0">'+s.name.slice(0,2).toUpperCase()+'</div>'+
            '<div><div style="font-weight:700;font-size:15px">'+s.name+'</div></div>'+
          '</div>'+
          '<div class="metric" style="margin-bottom:8px"><div class="metric-label">Days present</div><div class="metric-value">'+s.days+'</div></div>'+
          '<div class="metric" style="margin-bottom:12px"><div class="metric-label">Total advances</div><div class="metric-value" style="font-size:18px">₹'+fmt(s.totalAdv)+'</div></div>'+
          '<button class="btn btn-sm btn-primary" onclick="openAdvModal(\''+s.name+'\')"><i class="ti ti-plus"></i> Record advance</button>'+
        '</div>';
      }).join('')+
    '</div>'+
    // Attendance log
    '<div class="card" style="padding:0;overflow:hidden">'+
      '<div style="padding:1rem 1.25rem;font-size:14px;font-weight:600;border-bottom:1px solid #e2e8f0">Attendance log</div>'+
      '<div style="overflow-x:auto"><table>'+
        '<thead><tr><th>Date</th>'+STAFF.map(function(s){return '<th>'+s+'</th>';}).join('')+'</tr></thead>'+
        '<tbody>'+
          (function(){
            var dates = [...new Set(att.map(function(a){return a.date;}))].sort(function(a,b){return b.localeCompare(a);}).slice(0,30);
            return dates.length ? dates.map(function(date){
              return '<tr><td style="white-space:nowrap;font-weight:500">'+fmtDate(date)+'</td>'+
                STAFF.map(function(s){
                  var r=att.find(function(a){return a.date===date&&a.staff===s;});
                  return '<td>'+(r?'<span class="badge '+(r.present?'gg':'rg')+'">'+(r.present?'Present':'Absent')+'</span>':'—')+'</td>';
                }).join('')+
              '</tr>';
            }).join('') : '<tr><td colspan="'+(STAFF.length+1)+'"><div class="empty" style="padding:1.5rem">No attendance logged</div></td></tr>';
          })()+
        '</tbody>'+
      '</table></div>'+
    '</div>'+
    // Advance ledger
    '<div class="card" style="padding:0;overflow:hidden">'+
      '<div style="padding:1rem 1.25rem;font-size:14px;font-weight:600;border-bottom:1px solid #e2e8f0">Advance ledger</div>'+
      '<table><thead><tr><th>Date</th><th>Staff</th><th>Amount</th><th>Note</th><th></th></tr></thead><tbody>'+
        (advances.length ? advances.slice(0,30).map(function(a){
          return '<tr><td>'+fmtDate(a.date)+'</td><td>'+a.staff+'</td><td style="font-weight:600">₹'+fmt(a.amount)+'</td><td style="color:#64748b;font-size:12px">'+(a.note||'—')+'</td><td><button class="btn btn-sm btn-danger" onclick="delAdvance(\''+a.id+'\')">Del</button></td></tr>';
        }).join('') : '<tr><td colspan="5"><div class="empty" style="padding:1.5rem">No advances recorded</div></td></tr>')+
      '</tbody></table>'+
    '</div>';
}

function openEditStaffModal(){
  modal('<div class="modal">'+
    '<div class="modal-hd"><h3 style="font-size:15px;font-weight:700">Edit staff names</h3><button onclick="closeModal()" style="border:none;font-size:22px;background:none;cursor:pointer;color:#94a3b8">&times;</button></div>'+
    '<div class="modal-bd">'+
      '<p style="font-size:13px;color:#64748b;margin-bottom:12px">Names saved to Firestore — shared across all devices.</p>'+
      STAFF.map(function(s,i){return '<div class="fg"><label>Staff '+(i+1)+'</label><input type="text" id="sn-'+i+'" value="'+s+'"></div>';}).join('')+
    '</div>'+
    '<div class="modal-ft"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStaffNames()">Save names</button></div>'+
  '</div>');
}

async function saveStaffNames(){
  var btn=document.querySelector('.modal-ft .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var names=STAFF.map(function(_,i){return (document.getElementById('sn-'+i)||{value:''}).value.trim();}).filter(function(n){return n;});
  if(names.length!==STAFF.length){alert('All names required');if(btn){btn.disabled=false;btn.textContent='Save names';}return;}
  try{
    await saveStaffFS();
    STAFF=names;
    localStorage.setItem('hpf_staff',JSON.stringify(STAFF));
    await db.collection('meta').doc('staff').set({names:STAFF});
    closeModal();renderStaff();
  }catch(e){alert('Save failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Save names';} }
}

async function migrateStaffNames(){
  var oldNames=Object.keys(MIGRATION_MAP);
  var attFix=cache.attendance.filter(function(a){return oldNames.indexOf(a.staff)>-1;});
  var advFix=cache.advances.filter(function(a){return oldNames.indexOf(a.staff)>-1;});
  if(!attFix.length&&!advFix.length){alert('No old records found.');return;}
  if(!confirm('Rename '+attFix.length+' attendance + '+advFix.length+' advance records from Driver 1/2/Helper to Umesh/Revanna/Ramesh?'))return;
  var btn=document.getElementById('mig-btn');
  if(btn){btn.disabled=true;btn.textContent='Migrating…';}
  try{
    var batch=db.batch();
    attFix.forEach(function(a){batch.update(db.collection('attendance').doc(a.id),{staff:MIGRATION_MAP[a.staff]});});
    advFix.forEach(function(a){batch.update(db.collection('advances').doc(a.id),{staff:MIGRATION_MAP[a.staff]});});
    await batch.commit();
    alert('Done! '+( attFix.length+advFix.length)+' records updated.');
  }catch(e){alert('Migration failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Fix old records';} }
}

function openAttModal(){
  var d=today();
  modal('<div class="modal">'+
    '<div class="modal-hd"><h3 style="font-size:15px;font-weight:700">Log attendance</h3><button onclick="closeModal()" style="border:none;font-size:22px;background:none;cursor:pointer;color:#94a3b8">&times;</button></div>'+
    '<div class="modal-bd">'+
      '<div class="fg"><label>Date</label><input type="date" id="att-date" value="'+d+'"></div>'+
      STAFF.map(function(s){
        var ex=cache.attendance.find(function(a){return a.date===d&&a.staff===s;});
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9">'+
          '<span style="font-weight:500">'+s+'</span>'+
          '<div style="display:flex;gap:12px">'+
            '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="att-'+s.replace(/ /g,'_')+'" value="1"'+(ex&&ex.present?' checked':'')+'> Present</label>'+
            '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="att-'+s.replace(/ /g,'_')+'" value="0"'+(ex&&!ex.present?' checked':'')+'> Absent</label>'+
          '</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    '<div class="modal-ft"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAttendance()">Save attendance</button></div>'+
  '</div>');
}

async function saveAttendance(){
  var btn=document.querySelector('.modal-ft .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var date=document.getElementById('att-date').value;
  var batch=db.batch();
  cache.attendance.filter(function(a){return a.date===date;}).forEach(function(a){batch.delete(db.collection('attendance').doc(a.id));});
  STAFF.forEach(function(s){
    var val=(document.querySelector('input[name="att-'+s.replace(/ /g,'_')+'"]:checked')||{}).value;
    batch.set(db.collection('attendance').doc(uid()),{date:date,staff:s,present:val==='1'});
  });
  try{await batch.commit();closeModal();}catch(e){alert('Save failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Save attendance';} }
}

function openAdvModal(staff){
  modal('<div class="modal">'+
    '<div class="modal-hd"><h3 style="font-size:15px;font-weight:700">Record advance — '+staff+'</h3><button onclick="closeModal()" style="border:none;font-size:22px;background:none;cursor:pointer;color:#94a3b8">&times;</button></div>'+
    '<div class="modal-bd">'+
      '<div class="fr c2">'+
        '<div class="fg"><label>Date</label><input type="date" id="adv-date" value="'+today()+'"></div>'+
        '<div class="fg"><label>Amount (₹)</label><input type="number" id="adv-amount" min="0" placeholder="0"></div>'+
      '</div>'+
      '<div class="fg"><label>Note (optional)</label><input type="text" id="adv-note" placeholder="Reason…"></div>'+
    '</div>'+
    '<div class="modal-ft"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAdvance(\''+staff+'\')">Save</button></div>'+
  '</div>');
}

async function saveAdvance(staff){
  var btn=document.querySelector('.modal-ft .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var amount=Number(document.getElementById('adv-amount').value||0);
  if(!amount){alert('Enter an amount');if(btn){btn.disabled=false;btn.textContent='Save';}return;}
  try{
    await db.collection('advances').doc(uid()).set({date:document.getElementById('adv-date').value,staff:staff,amount:amount,note:document.getElementById('adv-note').value});
    closeModal();
  }catch(e){alert('Save failed: '+e.message);if(btn){btn.disabled=false;btn.textContent='Save';} }
}

async function delAdvance(id){if(!confirm('Delete this advance?'))return;await db.collection('advances').doc(id).delete();}

// ── EXCEL EXPORT ──────────────────────────────────────────────────────────────
async function exportExcel(){
  try{
    var results=await Promise.all([getAll('orders'),getAll('production'),getAll('attendance'),getAll('advances'),getAll('materials')]);
    var orders=results[0],prod=results[1],att=results[2],advs=results[3],mats=results[4];
    var wb=XLSX.utils.book_new();

    // Orders
    var oData=orders.map(function(o){return {'Date':fmtDate(o.orderDate),'Customer':o.customer,'Phone':o.phone||'','Address':o.address||'','Route':o.route||'','Km':o.km||0,'Pipes':Object.entries(o.pipes||{}).map(function(kv){return kv[0]+':'+kv[1];}).join(', '),'Total':o.total||0,'Advance':o.advance||0,'Balance':o.balance||0,'Status':o.status||''};});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(oData),'Orders');

    // Production
    var pData=prod.filter(function(p){return p.type!=='opening';}).map(function(p){var r={'Date':fmtDate(p.date)};PIPE_TYPES.forEach(function(t){r[t]=p.pipes&&p.pipes[t]||0;});r['Total']=PIPE_TYPES.reduce(function(s,t){return s+(p.pipes&&p.pipes[t]||0);},0);return r;});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pData.length?pData:[{No:'No data'}]),'Production');

    // Attendance
    var attDates=[...new Set(att.map(function(a){return a.date;}))].sort();
    var attData=attDates.map(function(date){var r={'Date':fmtDate(date)};STAFF.forEach(function(s){var a=att.find(function(x){return x.date===date&&x.staff===s;});r[s]=a?(a.present?'Present':'Absent'):'—';});return r;});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(attData.length?attData:[{No:'No data'}]),'Attendance');

    // Advances
    var advData=advs.map(function(a){return {'Date':fmtDate(a.date),'Staff':a.staff,'Amount':a.amount||0,'Note':a.note||''};});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(advData.length?advData:[{No:'No data'}]),'Advances');

    // Materials
    var matData=[];mats.forEach(function(m){
      var isWire=m.material==='steel_wire';
      var paid=(m.payments||[]).reduce(function(s,p){return s+(Number(p.amt||0));},0);
      matData.push({'Date':fmtDate(m.date),'Material':isWire?'Steel Wire':(MAT_SINGLE.find(function(r){return r.id===m.material;})||{label:m.material}).label,'Qty':isWire?'(see sizes)':m.qty||0,'Total ₹':m.totalAmt||0,'Paid ₹':paid,'Balance ₹':(m.totalAmt||0)-paid,'Supplier':m.supplier||''});
      if(isWire)WIRE_SIZES.forEach(function(sz){var s=m.sizes&&m.sizes[sz.id];if(s&&s.qty)matData.push({'Date':'','Material':'  '+sz.label,'Qty':s.qty,'Total ₹':s.amt||0,'Paid ₹':'','Balance ₹':'','Supplier':''});});
      (m.payments||[]).forEach(function(p){matData.push({'Date':fmtDate(p.date),'Material':'  → Payment','Qty':'','Total ₹':'','Paid ₹':p.amt||0,'Balance ₹':'','Supplier':p.note||''});});
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(matData.length?matData:[{No:'No data'}]),'Materials');

    XLSX.writeFile(wb,'HumePipes_'+today()+'.xlsx');
  }catch(e){alert('Export failed: '+e.message);}
}
